[package]
name = "moqros-cli"
description = "ROS 2 <-> Media over QUIC image bridge nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/moqros-cli"
readme = "../../README.md"
keywords = ["ros2", "moq", "quic", "video", "cli"]
categories = ["multimedia::video", "command-line-utilities", "science::robotics"]

[package.metadata.docs.rs]
features = ["doc-only"]

[features]
default = []
# H.264 support (loads Cisco's OpenH264 binary from OPENH264_LIBRARY at runtime).
h264 = ["moqros/h264"]
# Build docs without a ROS environment (docs.rs). Not for real use.
doc-only = ["moqros/doc-only"]

[[bin]]
name = "moqros-pub"
path = "src/bin/moqros-pub.rs"

[[bin]]
name = "moqros-sub"
path = "src/bin/moqros-sub.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
moqros = { workspace = true, features = ["ros"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Installed by cargo-ament-build (colcon) into share/moqros-cli.
[package.metadata.ros]
install_to_share = ["launch", "config"]
