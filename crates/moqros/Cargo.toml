[package]
name = "moqros"
description = "Stream ROS 2 sensor_msgs/Image topics over Media over QUIC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/moqros"
readme = "../../README.md"
keywords = ["ros2", "moq", "quic", "video", "robotics"]
categories = ["multimedia::video", "network-programming", "science::robotics"]
exclude = ["COLCON_IGNORE"]

[package.metadata.docs.rs]
features = ["h264", "doc-only"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["vp8"]
# VP8 via the system libvpx (royalty-free). Needs libvpx + pkg-config + libclang at build time.
vp8 = ["dep:env-libvpx-sys"]
# H.264 via Cisco's prebuilt OpenH264 library, loaded at runtime (never compiled from source).
h264 = ["dep:openh264"]
# ROS 2 bridge built on r2r. Requires a sourced ROS 2 environment at build time.
ros = ["dep:r2r", "dep:futures"]
# Build docs without a ROS environment (docs.rs). Not for real use.
doc-only = ["ros", "r2r/doc-only"]

[dependencies]
bytes.workspace = true
futures = { workspace = true, optional = true }
hang.workspace = true
moq-tokio.workspace = true
openh264 = { workspace = true, optional = true }
env-libvpx-sys = { workspace = true, optional = true }
r2r = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
