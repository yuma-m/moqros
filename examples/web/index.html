<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>moqros viewer</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
		body { margin: 0 auto; max-width: 960px; padding: 16px; }
		form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
		label { display: flex; flex-direction: column; font-size: 12px; gap: 2px; }
		input { font: inherit; padding: 4px 6px; min-width: 16rem; }
		button { align-self: end; font: inherit; padding: 4px 12px; }
		canvas { width: 100%; background: #000; border-radius: 6px; }
		small { opacity: .7; }
	</style>
	<script type="module">
		import "https://esm.sh/@moq/watch@0.6.2/element";
		import "https://esm.sh/@moq/watch@0.6.2/ui";

		const params = new URLSearchParams(location.search);
		const url = params.get("url") ?? `http://${location.hostname}:4443/anon`;
		const name = params.get("name") ?? "sample/image_raw";

		document.querySelector("#url").value = url;
		document.querySelector("#name").value = name;

		const watch = document.querySelector("moq-watch");
		watch.setAttribute("url", url);
		watch.setAttribute("name", name);
	</script>
</head>
<body>
	<h1>moqros viewer</h1>
	<form method="get">
		<label>Relay URL <input id="url" name="url"></label>
		<label>Broadcast <input id="name" name="name"></label>
		<button type="submit">Watch</button>
	</form>
	<moq-watch-ui>
		<!-- moqros broadcasts carry a hang catalog without the ".hang" name suffix. -->
		<moq-watch catalog-format="hang" delay="instant">
			<canvas></canvas>
		</moq-watch>
	</moq-watch-ui>
	<p><small>An <code>http://</code> relay URL makes the browser fetch the relay's self-signed certificate
		fingerprint from <code>/certificate.sha256</code>; use it for local development only.</small></p>
</body>
</html>
