<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>moqros viewer</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
		body { margin: 0 auto; max-width: 960px; padding: 16px; }
		form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
		label { display: flex; flex-direction: column; font-size: 12px; gap: 2px; }
		input { font: inherit; padding: 4px 6px; min-width: 16rem; }
		button { align-self: end; font: inherit; padding: 4px 12px; }
		canvas { width: 100%; background: #000; border-radius: 6px; }
		section { margin-top: 16px; }
		h2 { font-size: 16px; margin: 0 0 4px; }
		.status { font-size: 13px; margin-bottom: 6px; opacity: .8; }
		pre { background: rgb(127 127 127 / .12); border-radius: 6px; margin: 0; max-height: 24rem; min-height: 3rem; overflow: auto; padding: 12px; }
		small { opacity: .7; }
	</style>
	<script type="module">
		import "https://esm.sh/@moq/watch@0.6.2/element";
		import "https://esm.sh/@moq/watch@0.6.2/ui";
		import * as Moq from "https://esm.sh/@moq/net@0.4.2";

		const params = new URLSearchParams(location.search);
		const url = params.get("url") ?? `http://${location.hostname}:4443/anon`;
		const name = params.get("name") ?? "sample/image_raw";
		// Comma-separated data broadcasts shown below the video.
		const data = params.get("data") ?? "chatter";

		document.querySelector("#url").value = url;
		document.querySelector("#name").value = name;
		document.querySelector("#data").value = data;

		const watch = document.querySelector("moq-watch");
		if (name) {
			watch.setAttribute("url", url);
			watch.setAttribute("name", name);
		} else {
			document.querySelector("moq-watch-ui").hidden = true;
		}

		// The first data track moqros can read, as `moqros::DataSettings::from_catalog` picks it.
		function dataTrack(catalog) {
			const known = (config) => config.mode === "snapshot" || config.mode === "stream";
			for (const [track, config] of Object.entries(catalog.json?.tracks ?? {})) {
				if (known(config)) return { track, format: "json", ...config };
			}
			for (const [track, config] of Object.entries(catalog.binary?.tracks ?? {})) {
				if (known(config) && config.mime === "application/x-ros2-cdr") return { track, format: "cdr", ...config };
			}
		}

		// Show the latest message of one data broadcast in `status` and `output`.
		async function showData(origin, name, status, output) {
			status.textContent = "waiting for the broadcast…";
			const request = origin.request(Moq.Path.from(name), { announced: true });
			const broadcast = request.active.peek() ?? await new Promise((resolve) => {
				const dispose = request.active.subscribe((active) => active && (dispose?.(), resolve(active)));
			});

			const catalog = await broadcast.track("catalog.json").subscribe({ priority: 100 }).ordered().readJson();
			const data = dataTrack(catalog ?? {});
			if (!data) throw new Error("no data track in the catalog");
			const label = `${data.rosType ?? "unknown type"} · ${data.format} · ${data.mode}`;

			const track = broadcast.track(data.track).subscribe({ priority: 90 }).ordered();
			const decoder = new TextDecoder();
			let count = 0;
			let since = performance.now();
			let rate = 0;
			for (let frame; (frame = await track.readFrame()); ) {
				count++;
				const elapsed = (performance.now() - since) / 1000;
				if (elapsed >= 1) {
					rate = count / elapsed;
					count = 0;
					since = performance.now();
				}
				status.textContent = `${label} · ${rate.toFixed(1)} msg/s`;
				output.textContent = data.format === "json"
					? JSON.stringify(JSON.parse(decoder.decode(frame.payload)), null, 2)
					: `${frame.payload.byteLength} bytes of CDR`;
			}
			status.textContent = `${label} · broadcast ended`;
		}

		const names = data.split(",").map((name) => name.trim()).filter(Boolean);
		if (names.length) {
			// One connection for every data broadcast; `<moq-watch>` keeps its own for the video.
			const origin = new Moq.Origin.Producer();
			const connected = Moq.Connection.connect({ url: new URL(url), consume: origin });
			const template = document.querySelector("#data-panel");
			for (const name of names) {
				const panel = template.content.cloneNode(true);
				panel.querySelector("h2").textContent = name;
				const status = panel.querySelector(".status");
				const output = panel.querySelector("pre");
				document.querySelector("#panels").append(panel);
				connected
					.then(() => showData(origin, name, status, output))
					.catch((err) => {
						console.error(name, err);
						status.textContent = `error: ${err.message ?? err}`;
					});
			}
		}
	</script>
</head>
<body>
	<h1>moqros viewer</h1>
	<form method="get">
		<label>Relay URL <input id="url" name="url"></label>
		<label>Video broadcast <input id="name" name="name"></label>
		<label>Data broadcasts (comma-separated) <input id="data" name="data"></label>
		<button type="submit">Watch</button>
	</form>
	<moq-watch-ui>
		<!-- moqros broadcasts carry a hang catalog without the ".hang" name suffix. -->
		<moq-watch catalog-format="hang" delay="instant">
			<canvas></canvas>
		</moq-watch>
	</moq-watch-ui>
	<div id="panels"></div>
	<template id="data-panel">
		<section>
			<h2></h2>
			<div class="status">connecting…</div>
			<pre></pre>
		</section>
	</template>
	<p><small>Data panels show the latest message of <code>moqros-pub</code> topics sent with
		<code>format=json</code> (or <code>cdr</code>). An <code>http://</code> relay URL makes the browser fetch the
		relay's self-signed certificate fingerprint from <code>/certificate.sha256</code>; use it for local development
		only.</small></p>
</body>
</html>
