# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
# Check every feature, so optional codec / ROS dependencies are covered too.
all-features = true
# Only the platforms moqros ships for. Without this, cargo-deny also walks wasm32 and custom-cfg
# (e.g. `cfg(loom)`) dependencies that never get built.
targets = [
	"x86_64-unknown-linux-gnu",
	"aarch64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]

[advisories]
# Only flag unmaintained crates the workspace depends on directly: those we can replace ourselves.
# Transitive ones can only be fixed upstream, so failing CI on them is just noise. Vulnerabilities
# are still checked across the whole graph.
unmaintained = "workspace"
ignore = [
	# rsa (Marvin attack): only reached through moq-auth, a dev-dependency the relay tests use to sign
	# throwaway tokens. No fixed release exists.
	{ id = "RUSTSEC-2023-0071", reason = "dev-only via moq-auth; no fixed rsa release" },
]

[licenses]
# Every license must be compatible with distributing moqros as MIT OR Apache-2.0.
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"CC0-1.0",
	"ISC",
	"MIT",
	"MIT-0",
	# env-libvpx-sys (file-level copyleft; we only link against it).
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]

[bans]
# Duplicate versions are common across the moq / ROS stacks and not worth failing on.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies within the workspace have no version requirement to check.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
