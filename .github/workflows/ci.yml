name: CI

# Runs on every change, so the required check (`ci`) always reports. Changes that can't affect
# the Rust build (docs, the web viewer, …) skip the work instead; see `changes`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MOQ_RELAY_VERSION: 0.17.2

jobs:
  # Whether anything but docs, the web viewer and other files the Rust build doesn't read changed.
  # Manual runs always build.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**.md"
              - "!LICENSE-*"
              - "!images/**"
              - "!.dockerignore"
              - "!docker/**"
              - "!examples/web/**"

  # ROS-independent core: fmt, clippy, tests (incl. H.264, AV1, the GStreamer backend with software
  # encoders standing in for hardware ones, and the relay round trip).
  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvpx-dev libaom-dev libclang-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - run: cargo fmt --all --check
      - run: cargo clippy -p moqros --all-targets --features h264,av1,hw -- -D warnings
      - name: Install moq-relay
        run: |
          if ! command -v moq-relay >/dev/null; then
            cargo install moq-relay --version "$MOQ_RELAY_VERSION" --locked --no-default-features --features noq,websocket
          fi
      - name: Test
        run: |
          OPENH264_LIBRARY=$(./scripts/fetch_openh264.sh)
          MOQROS_RELAY_BIN=$(command -v moq-relay)
          export OPENH264_LIBRARY MOQROS_RELAY_BIN
          cargo test -p moqros --features h264,av1,hw

  # Dependency hygiene: advisories, licenses and sources (cargo-deny, see deny.toml) and
  # dependencies no code uses (cargo-shear).
  deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear
      - run: cargo deny --locked check
      - run: cargo shear

  # Same build docs.rs does: no ROS environment, r2r's `doc-only` bindings.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvpx-dev libclang-dev pkg-config
      - run: cargo doc -p moqros -p moqros-cli --no-deps --features moqros/h264,moqros/doc-only
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # Full workspace against a real ROS 2 install, plus the colcon (ament_cargo) package.
  ros:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}-ros-base
    env:
      IDL_PACKAGE_FILTER: std_msgs;sensor_msgs;geometry_msgs;rosgraph_msgs
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates clang libclang-dev pkg-config python3-pip \
            libaom-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions/checkout@v7
        with:
          path: src/moqros
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/moqros
          key: ${{ matrix.distro }}
      - name: rosdep install
        run: |
          rosdep update --rosdistro "$ROS_DISTRO"
          rosdep install --from-paths src -iy --rosdistro "$ROS_DISTRO"
      - name: Clippy (workspace)
        working-directory: src/moqros
        run: |
          # shellcheck disable=SC1090
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cargo clippy --workspace --all-targets --features moqros/h264,moqros/av1,moqros/hw --locked -- -D warnings
      # Only the ROS-dependent tests; the core job covers the rest.
      - name: Test (ROS)
        working-directory: src/moqros
        run: |
          # shellcheck disable=SC1090
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cargo test -p moqros-cli --features moqros/h264,moqros/av1,moqros/hw --locked
          cargo test -p moqros --features ros,h264 --lib --locked -- ros::
      - name: Install colcon-ros-cargo
        run: |
          pip3 install colcon-cargo colcon-ros-cargo
          cargo install cargo-ament-build --locked
      - name: colcon build
        run: |
          # shellcheck disable=SC1090
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --event-handlers console_cohesion+
      - name: Smoke test
        run: |
          # shellcheck disable=SC1091
          source install/setup.bash
          ros2 run moqros-cli moqros-pub --help
          ros2 run moqros-cli moqros-sub --help
          ros2 run moqros-cli moqros-bridge --help

  # The one required check: fails if any job above failed or was cancelled, and passes when they
  # passed or were skipped. A matrix job skipped as a whole reports as plain `ros`, not
  # `ros (jazzy)`, so the matrix jobs can't be required checks themselves.
  ci:
    if: always()
    needs: [changes, core, docs, ros]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
