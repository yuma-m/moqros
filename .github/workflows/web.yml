name: Web

on:
  push:
    branches: [main]
    paths: &web
      - "examples/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-check and build the viewer in examples/web. The build for GitHub Pages connects to a
  # relay on the viewer's machine by default.
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_RELAY_URL: http://localhost:4443/anon
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/web/dist

  # Publish the viewer to GitHub Pages from main.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
