name: Release

# Push a tag like `v0.1.0` to publish moqros and moqros-cli to crates.io.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    # moqros-cli's publish verification builds r2r, which needs a sourced ROS 2 environment.
    container: ros:jazzy-ros-base
    environment: crates-io
    permissions:
      contents: read
    env:
      IDL_PACKAGE_FILTER: std_msgs;sensor_msgs;geometry_msgs;rosgraph_msgs
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates clang libclang-dev pkg-config libvpx-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          xml_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' crates/moqros-cli/package.xml)
          echo "tag=$tag Cargo.toml=$cargo_version package.xml=$xml_version"
          [ "$tag" = "$cargo_version" ] && [ "$tag" = "$xml_version" ]
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # shellcheck disable=SC1090
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cargo publish --workspace --locked
