name: Release

# When a commit on main changes the workspace version (normally the PR opened by
# bump.yml), tag it, publish moqros and moqros-cli to crates.io and create a
# GitHub release. If a later job fails, use "Re-run failed jobs", or, when the fix is a
# change to this workflow, run it by hand on main.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The nightly docs.rs builds with (see "rustc version" on https://docs.rs/crate/<crate>/<version>/builds).
  # Pinned so a regression in a newer nightly doesn't block a release that docs.rs would build.
  DOCS_RS_NIGHTLY: nightly-2026-10-29

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read version
        id: version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          xml_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' crates/moqros-cli/package.xml)
          echo "Cargo.toml=$cargo_version package.xml=$xml_version"
          if [ "$cargo_version" != "$xml_version" ]; then
            echo "::error::Cargo.toml and package.xml versions differ"
            exit 1
          fi
          tag="v$cargo_version"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

  # Same build docs.rs does: its nightly, `--cfg docsrs`, no ROS environment (r2r's `doc-only`
  # bindings). Gates the release so a version that won't build on docs.rs isn't published.
  docs:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.DOCS_RS_NIGHTLY }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvpx-dev libclang-dev pkg-config
      - run: cargo doc -p moqros -p moqros-cli --no-deps --features moqros/h264,moqros/doc-only
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  tag:
    needs: [check, docs]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

  publish:
    needs: [check, tag]
    runs-on: ubuntu-24.04
    # moqros-cli's publish verification builds r2r, which needs a sourced ROS 2 environment.
    container: ros:jazzy-ros-base
    environment: crates-io
    permissions:
      contents: read
    env:
      IDL_PACKAGE_FILTER: std_msgs;sensor_msgs;geometry_msgs;rosgraph_msgs;diagnostic_msgs
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates clang libclang-dev pkg-config libvpx-dev
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # shellcheck disable=SC1090
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          cargo publish --workspace --locked

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
