version: 2
# Every ecosystem waits a few days so fresh releases settle before they're proposed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns:
          - "*"
