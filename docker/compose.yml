# End-to-end sample:
#   two image_source nodes (/sample/image_raw, /sample/frames/image_raw: video)
#   + ros2 topic pub (/chatter, /sample/pose: JSON data)
#     -> moqros-pub -> relay -> browser + moqros-sub (/moqros/image, /moqros/frames, /moqros/chatter, /moqros/pose)
#
#   docker compose -f docker/compose.yml up --build
#   CODEC=av1 docker compose -f docker/compose.yml up --build   # AV1 instead of VP8
#
# Sample inputs are generated into ./samples on first start (no host ffmpeg needed).
#   open http://localhost:8080
name: moqros

x-ros: &ros
  image: moqros/ros:latest
  environment:
    ROS_DOMAIN_ID: "42"
    RUST_LOG: info
  restart: unless-stopped

services:
  # moq-relay with a self-signed certificate; anyone may publish and subscribe under anon/.
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: relay
    image: moqros/relay:latest
    ports:
      - "4443:4443/udp" # QUIC / WebTransport
      - "4443:4443/tcp" # certificate fingerprint + WebSocket fallback
    restart: unless-stopped

  # One-shot job: create the sample video and PNG sequence in ./samples if missing.
  samples:
    <<: *ros
    command: ["/scripts/gen_sample.sh", "/samples"]
    volumes:
      - ../scripts:/scripts:ro
      - ../samples:/samples
    restart: "no"

  # The first camera: the sample video (1280x720, set WIDTH=640 to scale down) at 30 fps as bgr8.
  source:
    <<: *ros
    # The ROS services share one image; build it once here.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ros
    depends_on:
      samples:
        condition: service_completed_successfully
    # SAMPLE may be a video file or a directory of frames under ./samples.
    command: ["image_source", "/samples/${SAMPLE:-sample.mp4}", "--topic", "/sample/image_raw", "--fps", "30", "--width", "${WIDTH:-1280}"]
    volumes:
      - ../samples:/samples:ro
    # The ROS services share this container's network and IPC namespaces, like
    # processes on one robot. Fast DDS then moves images over shared memory;
    # large best-effort images over UDP between containers drop many frames.
    ipc: shareable

  # A second camera: the PNG sequence (640x480) at 15 fps.
  source-frames:
    <<: *ros
    command: ["image_source", "/samples/frames", "--topic", "/sample/frames/image_raw", "--fps", "15",
              "--frame-id", "frames"]
    volumes:
      - ../samples:/samples:ro
    network_mode: service:source
    ipc: service:source
    depends_on:
      samples:
        condition: service_completed_successfully
      source:
        condition: service_started

  # Publishes both cameras as video broadcasts, and /chatter and /sample/pose as JSON data.
  # --reliable matches the sources' reliable QoS.
  moqros-pub:
    <<: *ros
    command: ["moqros-pub", "--topic", "/sample/image_raw", "--topic", "/sample/frames/image_raw",
              "--topic", "/chatter,format=json", "--topic", "/sample/pose,format=json",
              "--url", "http://relay:4443/anon", "--reliable", "--codec", "${CODEC:-vp8}"]
    network_mode: service:source
    ipc: service:source
    depends_on: [relay, source, source-frames, chatter, pose]

  # Republishes the four broadcasts: decoded rgb8 images on /moqros/image and /moqros/frames,
  # and the data on /moqros/chatter and /moqros/pose.
  moqros-sub:
    <<: *ros
    command: ["moqros-sub", "--broadcast", "sample/image_raw,topic=/moqros/image",
              "--broadcast", "sample/frames/image_raw,topic=/moqros/frames", "--broadcast", "chatter",
              "--broadcast", "sample/pose,topic=/moqros/pose", "--url", "http://relay:4443/anon"]
    network_mode: service:source
    ipc: service:source
    depends_on: [relay, source]

  # Any message type can go out as data; moqros-pub streams this topic as JSON. `now` stamps
  # each message with the publish time; only every 100th (one per 10 s) is logged.
  chatter:
    <<: *ros
    command: ["ros2", "topic", "pub", "-r", "10", "-p", "100", "/chatter", "std_msgs/msg/Header",
              "{stamp: now, frame_id: chatter}"]
    network_mode: service:source
    ipc: service:source
    depends_on: [source]

  # A second data topic of another type: a fixed robot pose, stamped like /chatter. The viewer
  # shows both with its "Stamp" renderer (std_msgs/msg/Header and any *Stamped type).
  pose:
    <<: *ros
    command: ["ros2", "topic", "pub", "-r", "5", "-p", "50", "/sample/pose", "geometry_msgs/msg/PoseStamped",
              "{header: {stamp: now, frame_id: map}, pose: {position: {x: 1.0, y: 0.5}, orientation: {w: 1.0}}}"]
    network_mode: service:source
    ipc: service:source
    depends_on: [source]

  # The viewer (examples/web), built with Node and served by nginx.
  web:
    build:
      context: ../examples/web
    image: moqros/web:latest
    ports:
      - "8080:80"
